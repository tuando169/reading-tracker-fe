<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Book Spine/Cover Gradient -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Page Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#475569" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.08" />
    </filter>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#dotPattern)" />

  <!-- Subtle Border Inner -->
  <rect x="1" y="1" width="398" height="398" rx="0" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Central Illustrated Book Graphic -->
  <g filter="url(#softShadow)" transform="translate(130, 95)">
    <!-- Back Pages / Thickness -->
    <rect x="6" y="8" width="128" height="154" rx="10" fill="#cbd5e1" />
    <rect x="3" y="4" width="134" height="158" rx="10" fill="#e2e8f0" />

    <!-- Front Book Cover -->
    <rect x="0" y="0" width="140" height="160" rx="12" fill="url(#bookCoverGrad)" />

    <!-- Spine Accent Highlight -->
    <rect x="0" y="0" width="18" height="160" rx="12" fill="#4338ca" opacity="0.35" />
    <line x1="18" y1="0" x2="18" y2="160" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Decorative Cover Lines -->
    <rect x="36" y="40" width="68" height="6" rx="3" fill="#ffffff" fill-opacity="0.85" />
    <rect x="36" y="54" width="46" height="5" rx="2.5" fill="#c7d2fe" fill-opacity="0.9" />

    <!-- Minimalist Bookmark Ribbon -->
    <path d="M96 0 V42 L106 34 L116 42 V0 Z" fill="#f43f5e" />

    <!-- Center Icon Stamp -->
    <circle cx="70" cy="104" r="22" fill="#ffffff" fill-opacity="0.15" />
    <path d="M60 106 C60 102 65 101 70 103 C75 101 80 102 80 106 V112 C75 110 65 110 60 112 Z" fill="#ffffff" fill-opacity="0.9" />
  </g>
</svg>
